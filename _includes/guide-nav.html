<ul class="guide-nav-list">
  <li><a href="/guide/"{% if include.here == "" %} aria-current="page"{% endif %}>Overview</a></li>
</ul>
{%- for g in site.data.guide %}
{%- assign slugs = g.pages | map: "slug" %}
<details class="guide-nav-section"{% if slugs contains include.here %} open{% endif %}>
  <summary class="guide-nav-group">{{ g.group | escape }}</summary>
  <ul class="guide-nav-list">
    {%- for p in g.pages %}
    <li><a href="/guide/{{ p.slug }}/"{% if p.slug == include.here %} aria-current="page"{% endif %}>{{ p.title | escape }}</a></li>
    {%- endfor %}
  </ul>
</details>
{%- endfor %}

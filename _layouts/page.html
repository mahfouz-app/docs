<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="{{ page.description | escape }}" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://docs.mahfouz.app{{ page.url }}" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <title>{{ page.title | escape }} | Mahfouz</title>
  </head>
  <body class="guide-page">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="/" aria-label="Mahfouz home">
          <img src="/images/logo.png" alt="Mahfouz" width="2172" height="724" />
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="/#features" aria-current="page">Features</a>
          <a href="/#privacy">Privacy</a>
          <a href="/#agents" aria-current="page">Agents</a>
          <a href="/compare/">Compare</a>
          <a href="/guide/">User guide</a>
          <a class="nav-download" href="/#downloads">Download</a>
        </nav>
        <div class="theme-switch" role="group" aria-label="Theme">
          <button type="button" data-theme="light" aria-pressed="false" title="Light">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
            <span class="sr-only">Light</span>
          </button>
          <button type="button" data-theme="dark" aria-pressed="false" title="Dark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
            <span class="sr-only">Dark</span>
          </button>
          <button type="button" data-theme="system" aria-pressed="true" title="System">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>
            <span class="sr-only">System</span>
          </button>
        </div>
      </div>
    </header>

    <main class="shell guide-main" id="main">
      <p class="guide-breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span aria-current="page">{{ page.title | escape }}</span></p>
      <article class="guide-content">
        <h1>{{ page.title | escape }}</h1>
        {{ content }}
      </article>
    </main>

    <footer class="site-footer shell">
      <div class="footer-brand">
        <a class="emblem-link" href="/" aria-label="Mahfouz home">
          <img src="/images/emblem.png" alt="" width="1254" height="1254" />
        </a>
        <p>Markdown notes, kept in your hands.</p>
      </div>
      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="/">Mahfouz home</a>
        <a href="/changelog/">Changelog</a>
        <a href="/privacy/">Privacy</a>
        <a href="/license/">License</a>
      </nav>
    </footer>
  </body>
</html>

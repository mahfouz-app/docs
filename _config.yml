exclude:
  - README.md
  - AGENTS.md
  - DESIGN.md
  - CLAUDE.md
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor

# _plugins/ is the `plugins` collection (pages about Mahfouz plugins), not
# Ruby. Point Jekyll's plugin directory elsewhere so nothing in it is ever
# loaded as code. (The github-pages gem also forces safe mode.)
plugins_dir: _jekyll_plugins

collections:
  plugins:
    output: true
    permalink: /plugins/:path/

defaults:
  - scope:
      type: plugins
    values:
      layout: plugin
